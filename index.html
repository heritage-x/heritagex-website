<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeritageX | Global Automotive Asset Intelligence</title>
  <style>
    :root {
      --white: #ffffff;
      --soft-white: rgba(255, 255, 255, 0.75);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; background: #000; overflow: hidden; }

    /* 背景：极简暗色，带微弱纹理 */
    .hero-bg {
      position: fixed; inset: 0; z-index: -1;
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%), 
                  url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=2400');
      background-size: cover;
      background-position: center;
    }

    /* 顶部导航 */
    .topbar { position: fixed; top: 0; left: 0; right: 0; padding: 48px 64px; display: flex; justify-content: flex-end; z-index: 100; }
    .lang-switcher {
      font-size: 12px; font-weight: 600; color: var(--white); text-decoration: none;
      letter-spacing: 1px; padding: 8px 20px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.25);
      transition: all 0.3s;
    }
    .lang-switcher:hover { background: var(--white); color: #000; border-color: var(--white); }

    /* 内容区域：Shopify 经典的左侧或中心布局 */
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 40px; }
    .hero { max-width: 1000px; text-align: center; }

    /* 品牌名：解决所有裁切问题，纯白有力 */
    h1 {
      font-size: clamp(64px, 12vw, 128px); font-weight: 800; letter-spacing: -0.04em;
      line-height: 1; margin: 0 0 24px; color: var(--white);
    }

    /* Slogan：极致优化，字间距拉开，确保每一个字符亮度绝对统一 */
    .subtitle {
      font-size: clamp(16px, 1.8vw, 22px); color: var(--soft-white);
      line-height: 1.6; letter-spacing: 0.1em; margin: 0 auto 56px;
      max-width: 800px; font-weight: 400;
    }
    .subtitle b { color: var(--white); font-weight: 600; }

    /* 按钮：极简且有力的交互感 */
    .actions { display: flex; gap: 20px; justify-content: center; }
    .btn {
      padding: 18px 48px; border-radius: 6px; font-weight: 600; font-size: 16px;
      text-decoration: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-white { background: var(--white); color: #000; }
    .btn-white:hover { background: #e8e8e8; transform: translateY(-2px); }
    .btn-outline { background: rgba(0,0,0,0.3); color: var(--white); border: 1px solid rgba(255,255,255,0.4); backdrop-filter: blur(8px); }
    .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: var(--white); transform: translateY(-2px); }

    footer { position: fixed; bottom: 48px; width: 100%; text-align: center; font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 4px; }
  </style>
</head>
<body>
  <div class="hero-bg"></div>
  <div class="topbar"><a href="/cn/" class="lang-switcher">CN / EN</a></div>
  
  <main class="wrap">
    <section class="hero">
      <h1>HeritageX</h1>
      <p class="subtitle">
        Bridging heritage assets with <b>global sourcing</b> and <b>AI precision</b>.
      </p>
      <div class="actions">
        <a class="btn btn-white" href="/explore/">Explore Assets</a>
        <a class="btn btn-outline" href="/valuation/">AI Valuation</a>
      </div>
    </section>
  </main>

  <footer>© 2026 HERITAGEX SYDNEY</footer>
</body>
</html>
