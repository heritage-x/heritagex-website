<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeritageX | Global Automotive Asset Intelligence</title>
  <style>
    :root {
      /* Shopify 风格的深邃色调 */
      --bg: #0a0b10;
      --fg: #ffffff;
      --fg-muted: rgba(255, 255, 255, 0.7);
      --btn-bg: #ffffff;
      --btn-fg: #000000;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }

    /* --- 极简背景：模仿摄影灯光效果，拒绝浮夸 --- */
    .background {
      position: fixed; inset: 0; z-index: -1;
      background: 
        radial-gradient(circle at 20% 30%, rgba(40, 50, 90, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(60, 30, 80, 0.1) 0%, transparent 50%),
        #050608;
    }

    /* --- 右上角简洁切换 --- */
    .topbar { position: fixed; top: 0; left: 0; right: 0; padding: 40px 60px; display: flex; justify-content: flex-end; z-index: 100; }
    .lang-link {
      font-size: 12px; font-weight: 600; color: var(--fg); text-decoration: none;
      letter-spacing: 1px; padding: 6px 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2);
      transition: 0.2s;
    }
    .lang-link:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

    /* --- 主体内容 --- */
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; }
    .hero { max-width: 900px; padding: 0 40px; }

    /* 品牌名：纯白、无渐变、解决裁切 */
    h1 {
      font-size: clamp(60px, 10vw, 120px); font-weight: 800; letter-spacing: -0.03em;
      line-height: 1.2; margin: 0 0 16px; color: #fff;
    }

    /* Slogan：修复亮度不均，采用恒定的次级白 */
    .subtitle {
      font-size: clamp(16px, 2vw, 22px); color: var(--fg-muted);
      line-height: 1.5; letter-spacing: 0.05em; margin-bottom: 48px;
    }
    .subtitle b { color: #fff; font-weight: 600; }

    /* --- 对等且有质感的按钮 --- */
    .actions { display: flex; gap: 16px; justify-content: center; }
    .btn {
      padding: 16px 40px; border-radius: 6px; font-weight: 600; font-size: 15px;
      text-decoration: none; transition: 0.2s ease;
    }
    .btn-main { background: var(--btn-bg); color: var(--btn-fg); }
    .btn-main:hover { background: #e2e2e2; }
    .btn-sub { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .btn-sub:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

    footer { position: fixed; bottom: 40px; width: 100%; text-align: center; font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="topbar"><a href="/cn/" class="lang-link">CN / EN</a></div>
  
  <main class="wrap">
    <section class="hero">
      <h1>HeritageX</h1>
      <p class="subtitle">
        Bridging heritage assets with <b>global sourcing</b> and <b>AI precision</b>.
      </p>
      <div class="actions">
        <a class="btn btn-main" href="/explore/">Explore Assets</a>
        <a class="btn btn-sub" href="/valuation/">AI Valuation</a>
      </div>
    </section>
  </main>

  <footer>© 2026 HERITAGEX SYDNEY</footer>
</body>
</html>
