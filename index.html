<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeritageX</title>
  <meta name="description" content="Where heritage plates, classic automobiles and global sourcing meet AI intelligence and Australian licensed import & export operations." />
  <style>
    :root{
      --bg:#07090d;
      --fg:#ffffff;
      --muted: rgba(255,255,255,.72);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Segoe UI,Roboto,sans-serif;
      background: var(--bg);
      overflow-x:hidden;
    }

    .bg{
      position:fixed;
      inset:0;
      z-index:-1;
      background:
        radial-gradient(1200px 700px at 50% 35%, rgba(255,255,255,.08), rgba(255,255,255,0) 55%),
        radial-gradient(900px 600px at 15% 20%, rgba(120,170,255,.10), rgba(120,170,255,0) 60%),
        radial-gradient(900px 600px at 85% 25%, rgba(180,140,255,.09), rgba(180,140,255,0) 62%),
        linear-gradient(180deg, #05070a 0%, #07090d 45%, #06070b 100%);
    }

    .bg::before{
      content:"";
      position:absolute;
      inset:-40px;
      background: radial-gradient(1200px 900px at 50% 40%,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,.45) 80%,
        rgba(0,0,0,.75) 100%);
      pointer-events:none;
    }

    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 120px 20px;
      text-align:center;
    }

    h1{
      margin:0;
      font-size: clamp(46px, 7vw, 76px);
      font-weight: 520;
      letter-spacing: 2px;
    }

    .slogan{
      margin: 28px auto 0;
      font-size: clamp(16px, 2.1vw, 18px);
      line-height: 1.9;
      color: var(--muted);
      max-width: 820px;
      font-weight: 320;
    }

    .cta{
      margin-top: 70px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 14px 48px;
      border-radius: 999px;
      background: #ffffff;
      color: #0b0d11;
      text-decoration:none;
      font-weight: 560;
      letter-spacing: .4px;
      box-shadow:
        0 20px 55px rgba(0,0,0,.35),
        0 1px 0 rgba(255,255,255,.22) inset;
      transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
    }

    .btn:hover{
      transform: translateY(-2px);
      box-shadow:
        0 26px 70px rgba(0,0,0,.45),
        0 1px 0 rgba(255,255,255,.22) inset;
      background: #f2f2f2;
    }

    .foot{
      margin-top: 60px;
      font-size: 12px;
      opacity: .6;
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <main class="wrap">
    <div>
      <h1>HeritageX</h1>

      <p class="slogan">
        Where heritage plates, classic automobiles and global sourcing<br>
        meet AI intelligence and Australian licensed import &amp; export operations.
      </p>

      <div class="cta">
        <a class="btn" href="/valuation">Explore</a>
      </div>

      <div class="foot">
        © 2026 HeritageX. All rights reserved.
      </div>
    </div>
  </main>
</body>
</html>
