<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeritageX | AI 驱动的汽车资产专家</title>
  <style>
    :root { --white: #ffffff; --soft-white: rgba(255, 255, 255, 0.8); }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body { height: 100%; margin: 0; font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; background: #000; overflow: hidden; }

    .hero-bg {
      position: fixed; inset: 0; z-index: -1;
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%), 
                  url('https://images.unsplash.com/photo-1542362567-b05503f35259?auto=format&fit=crop&q=80&w=2400');
      background-size: cover; background-position: center;
    }

    .topbar { position: fixed; top: 0; left: 0; right: 0; padding: 48px 64px; display: flex; justify-content: flex-end; z-index: 100; }
    .lang-switcher { font-size: 12px; font-weight: 600; color: var(--white); text-decoration: none; letter-spacing: 1px; padding: 8px 20px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.25); }
    .lang-switcher:hover { background: var(--white); color: #000; }

    .wrap { height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 40px; }
    .hero { max-width: 1000px; text-align: center; }

    h1 { font-size: clamp(64px, 12vw, 128px); font-weight: 800; letter-spacing: -0.02em; line-height: 1; margin: 0 0 24px; color: var(--white); }
    
    .subtitle { font-size: clamp(18px, 2.2vw, 28px); color: var(--soft-white); line-height: 1.5; letter-spacing: 0.2em; margin-bottom: 56px; font-weight: 300; }
    .subtitle b { color: var(--white); font-weight: 600; }

    .actions { display: flex; gap: 20px; justify-content: center; }
    .btn { padding: 18px 50px; border-radius: 6px; font-weight: 600; font-size: 17px; text-decoration: none; transition: 0.3s; }
    .btn-white { background: var(--white); color: #000; }
    .btn-outline { background: rgba(0,0,0,0.3); color: var(--white); border: 1px solid rgba(255,255,255,0.4); backdrop-filter: blur(8px); }

    footer { position: fixed; bottom: 48px; width: 100%; text-align: center; font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 4px; }
  </style>
</head>
<body>
  <div class="hero-bg"></div>
  <div class="topbar"><a href="/" class="lang-switcher">CN / EN</a></div>
  
  <main class="wrap">
    <section class="hero">
      <h1>HeritageX</h1>
      <p class="subtitle">连接稀缺文化资产，<br>驱动<b>全球寻源</b>与 <b>AI 精准估值</b>。</p>
      <div class="actions">
        <a class="btn btn-white" href="/cn/explore/">探索资产</a>
        <a class="btn btn-outline" href="/cn/valuation/">AI 估值</a>
      </div>
    </section>
  </main>

  <footer>© 2026 HERITAGEX SYDNEY</footer>
</body>
</html>
