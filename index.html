<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeritageX | AI Powered Automotive Assets</title>
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --accent: #5a8cff;
      --glass: rgba(255, 255, 255, 0.03);
      --hair: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }

    /* --- 修复背景：增加深邃渐变层级 --- */
    .scene { position: fixed; inset: 0; z-index: -1; }
    .orb {
      position: absolute; top: 45%; left: 50%; width: 70vw; height: 70vw;
      background: radial-gradient(circle at center, rgba(90, 140, 255, 0.15) 0%, rgba(180, 120, 255, 0.05) 30%, transparent 70%);
      transform: translate(-50%, -50%); filter: blur(80px);
      animation: breathe 15s ease-in-out infinite alternate;
    }
    .drift {
      position: absolute; inset: -10%;
      background: radial-gradient(circle at 10% 10%, rgba(90, 255, 220, 0.03) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(180, 120, 255, 0.03) 0%, transparent 40%);
      transition: transform 0.5s cubic-bezier(0.1, 0, 0.2, 1);
    }
    @keyframes breathe { from { opacity: 0.3; transform: translate(-50%, -50%) scale(1); } to { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); } }

    /* --- 导航 --- */
    .topbar { position: fixed; top: 0; left: 0; right: 0; padding: 40px; display: flex; justify-content: flex-end; z-index: 100; }
    .lang-switcher { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #fff; text-decoration: none; padding: 10px 24px; border-radius: 99px; border: 1px solid var(--hair); background: var(--glass); backdrop-filter: blur(20px); transition: 0.4s; }
    .lang-switcher:hover { border-color: var(--accent); background: rgba(255,255,255,0.1); box-shadow: 0 0 20px rgba(90, 140, 255, 0.2); }

    /* --- 内容排版 --- */
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
    .hero { text-align: center; width: 100%; max-width: 1200px; padding: 0 40px; }

    /* 品牌名：修复 g 的显示，增加柔和渐变 */
    h1 {
      font-size: clamp(64px, 12vw, 140px); font-weight: 800; letter-spacing: -0.04em; 
      line-height: 1.2; margin: 0 0 10px; padding-bottom: 10px;
      background: linear-gradient(180deg, #FFFFFF 30%, #999999 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* Slogan：修复亮暗不均，采用统一的半透明高级白 */
    .subtitle {
      font-size: clamp(14px, 1.8vw, 18px); 
      color: rgba(255, 255, 255, 0.6); /* 统一色调，避免一半亮一半暗 */
      line-height: 1.6; letter-spacing: 0.15em; text-transform: uppercase;
      margin-bottom: 60px;
    }
    .subtitle b { color: #ffffff; font-weight: 600; }

    /* --- 按钮：完全对等的高级感 --- */
    .actions { display: flex; gap: 24px; justify-content: center; }
    .btn {
      position: relative; padding: 20px 50px; border-radius: 16px;
      font-weight: 700; text-decoration: none; font-size: 15px; color: #fff;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid var(--hair); backdrop-filter: blur(20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:hover {
      transform: translateY(-5px); border-color: var(--accent);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(90, 140, 255, 0.1);
    }

    footer { position: fixed; bottom: 40px; width: 100%; text-align: center; font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 4px; }
  </style>
</head>
<body>
  <div class="scene"><div class="orb"></div><div class="drift" id="drift"></div></div>
  <div class="topbar"><a href="/cn/" class="lang-switcher">CN / EN</a></div>
  <main class="wrap">
    <section class="hero">
      <div style="font-size: 11px; color: var(--accent); font-weight: 800; letter-spacing: 6px; margin-bottom: 30px; text-shadow: 0 0 15px rgba(90, 140, 255, 0.4);">FUTURE OF ASSETS</div>
      <h1>HeritageX</h1>
      <p class="subtitle">Bridging Heritage Assets with <b>Global Sourcing</b> & <b>AI Precision</b></p>
      <div class="actions">
        <a class="btn" href="/explore/">Explore Assets</a>
        <a class="btn" href="/valuation/">AI Valuation</a>
      </div>
    </section>
  </main>
  <footer>© 2026 HERITAGEX SYDNEY</footer>
  <script>
    const drift = document.getElementById('drift');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 40;
      const y = (e.clientY / window.innerHeight - 0.5) * 40;
      drift.style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>
</body>
</html>
