<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>探索资产 — HeritageX</title>
  <style>
    :root {
      --bg: #030407;
      --fg: #fff;
      --accent: #5a8cff;
      --hair: rgba(255, 255, 255, .1);
      --glass: rgba(255, 255, 255, .05);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--fg); background: var(--bg); overflow-x: hidden; }

    /* --- 继承欢迎页动态背景 --- */
    .scene { position: fixed; inset: 0; z-index: -1; }
    .orb {
      position: absolute; top: 40%; left: 50%; width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(90, 140, 255, 0.12) 0%, transparent 70%);
      transform: translate(-50%, -50%); filter: blur(60px);
      animation: pulse 12s ease-in-out infinite alternate;
    }
    .drift { position: absolute; inset: -5%; background: radial-gradient(circle at 80% 20%, rgba(180, 120, 255, 0.08) 0%, transparent 40%); transition: transform 0.3s ease-out; }
    @keyframes pulse { from { opacity: 0.4; transform: translate(-50%, -50%) scale(1); } to { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); } }

    /* --- 统一导航与 CN/EN 切换 --- */
    .topbar { position: fixed; top: 0; left: 0; right: 0; padding: 40px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .logo { font-weight: 800; font-size: 18px; text-decoration: none; color: #fff; letter-spacing: -1px; }
    .lang-switcher { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #fff; text-decoration: none; padding: 8px 20px; border-radius: 99px; border: 1px solid var(--hair); background: var(--glass); backdrop-filter: blur(10px); }

    /* --- 页面主体 --- */
    .wrap { max-width: 1100px; margin: 0 auto; padding: 160px 40px 100px; text-align: center; }
    h1 { 
      font-size: clamp(40px, 8vw, 80px); font-weight: 800; letter-spacing: -0.02em; 
      line-height: 1.2; margin: 0 0 20px; padding-bottom: 15px;
      background: linear-gradient(to bottom, #fff 60%, rgba(255,255,255,0.4)); 
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
    }
    .sub { font-size: 14px; color: rgba(255,255,255,0.4); letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 60px; }

    /* --- 磨砂卡片 --- */
    .grid { display: grid; gap: 24px; grid-template-columns: repeat(3, 1fr); margin-bottom: 80px; }
    .card { background: var(--glass); border: 1px solid var(--hair); border-radius: 20px; padding: 40px 30px; text-align: left; backdrop-filter: blur(15px); transition: 0.4s; }
    .card:hover { transform: translateY(-5px); border-color: var(--accent); background: rgba(255,255,255,0.08); }
    .card h2 { font-size: 18px; margin-bottom: 20px; color: #fff; letter-spacing: 2px; }
    .card ul { padding: 0; list-style: none; margin: 0; color: rgba(255,255,255,0.4); font-size: 14px; line-height: 2.2; }
    .card li::before { content: "—"; color: var(--accent); margin-right: 12px; }

    /* --- 统一按钮 --- */
    .btn-action { position: relative; padding: 18px 50px; border-radius: 14px; font-weight: 700; text-decoration: none; font-size: 16px; color: #fff; background: var(--glass); border: 1px solid var(--hair); backdrop-filter: blur(15px); cursor: pointer; transition: 0.3s; letter-spacing: 2px; }
    .btn-action:hover { border-color: var(--accent); background: #fff; color: #000; transform: translateY(-3px); box-shadow: 0 15px 30px rgba(90,140,255,0.2); }

    /* --- 弹窗适配 --- */
    .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); z-index: 200; padding: 20px; }
    .modal.open { display: flex; }
    .modal-box { background: #0c0d11; border: 1px solid var(--hair); border-radius: 24px; padding: 40px; width: 100%; max-width: 480px; }
    select, textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--hair); border-radius: 12px; color: #fff; padding: 14px; margin-bottom: 20px; font-size: 14px; outline: none; }
    .field-label { display: block; font-size: 10px; color: var(--accent); font-weight: 800; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 2px; }

    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .wrap { padding-top: 120px; } }
  </style>
</head>
<body>
  <div class="scene"><div class="orb"></div><div class="drift" id="drift"></div></div>

  <div class="topbar">
    <a href="/cn/" class="logo">HeritageX</a>
    <a href="/explore/" class="lang-switcher">CN / EN</a>
  </div>

  <main class="wrap">
    <h1>经典资产</h1>
    <p class="sub">为顶级收藏家提供精准寻源服务</p>

    <div class="grid">
      <div class="card">
        <h2>文化车牌</h2>
        <ul><li>数字车牌寻源</li><li>私人所有权转让</li><li>资产增值分析</li></ul>
      </div>
      <div class="card">
        <h2>经典名车</h2>
        <ul><li>全球寻源网络</li><li>进出口物流协调</li><li>私人收藏顾问</li></ul>
      </div>
      <div class="card">
        <h2>稀缺零配件</h2>
        <ul><li>OEM 库存定位</li><li>供应链质量审计</li><li>正品身份鉴定</li></ul>
      </div>
    </div>
    <button class="btn-action" onclick="toggleModal(true)">提交需求</button>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h3 style="margin:0 0 30px; font-size:24px">提交咨询</h3>
      <label class="field-label">咨询类别</label>
      <select id="cat">
        <option>文化数字车牌</option>
        <option>经典 / 稀缺车型</option>
        <option>OEM 原厂零件寻源</option>
      </select>
      <label class="field-label">需求描述</label>
      <textarea id="desc" rows="4" placeholder="车型、年份或车牌号段..."></textarea>
      <div style="display:flex; gap:12px">
        <button class="btn-action" style="flex:2; background:#fff; color:#000" onclick="sendInquiry()">通过 WhatsApp 发送</button>
        <button style="flex:1; background:transparent; border:1px solid var(--hair); color:#fff; border-radius:14px; cursor:pointer" onclick="toggleModal(false)">取消</button>
      </div>
    </div>
  </div>

  <script>
    const drift = document.getElementById('drift');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 30;
      const y = (e.clientY / window.innerHeight - 0.5) * 30;
      drift.style.transform = `translate(${x}px, ${y}px)`;
    });
    function toggleModal(s) { document.getElementById('modal').classList.toggle('open', s); }
    function sendInquiry() {
      const cat = document.getElementById('cat').value;
      const desc = document.getElementById('desc').value;
      if(!desc) return alert("请填写详细需求");
      window.open(`https://wa.me/61499987789?text=*HeritageX 咨询*%0A*类别:* ${cat}%0A*详情:* ${desc}`, '_blank');
      toggleModal(false);
    }
  </script>
</body>
</html>
